name: Publish sample app to TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (default: 1.0.<build number>)"
        required: false
      build_number:
        description: "Build number (default: latest TestFlight build + 1)"
        required: false
      changelog:
        description: "What to Test notes (default: commits since the last bump)"
        required: false
      latest_core:
        description: "Build against the latest sdk-ios-core (develop) instead of the released framework"
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  beta:
    name: fastlane beta
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout sdk-ios-core
        if: inputs.latest_core
        uses: actions/checkout@v4
        with:
          repository: viafoura/sdk-ios-core
          ref: develop
          ssh-key: ${{ secrets.SDK_IOS_CORE_DEPLOY_KEY }}
          path: sdk-ios-core

      - name: Build ViafouraSDK.xcframework from sdk-ios-core
        if: inputs.latest_core
        id: core
        run: |
          set -o pipefail
          echo "/sdk-ios-core/" >> .git/info/exclude
          build="$RUNNER_TEMP/core"
          cd "sdk-ios-core/Viafoura SDK"
          log="$RUNNER_TEMP/core-build.log"
          for sdk in iphonesimulator iphoneos; do
            if ! xcodebuild archive \
              -scheme ViafouraSDK \
              -archivePath "$build/ViafouraSDK-$sdk.xcarchive" \
              -sdk "$sdk" \
              SKIP_INSTALL=NO > "$log" 2>&1; then
              grep -E "error:|BUILD FAILED|ARCHIVE FAILED" "$log" | sort -u || true
              exit 1
            fi
          done
          xcodebuild -create-xcframework \
            -framework "$build/ViafouraSDK-iphonesimulator.xcarchive/Products/Library/Frameworks/ViafouraSDK.framework" \
            -framework "$build/ViafouraSDK-iphoneos.xcarchive/Products/Library/Frameworks/ViafouraSDK.framework" \
            -output "$build/ViafouraSDK.xcframework" > /dev/null
          find "$build/ViafouraSDK.xcframework" -name "*.swiftinterface" -exec sed -i '' -e 's/ViafouraSDK\.//g' {} \;
          echo "xcframework=$build/ViafouraSDK.xcframework" >> "$GITHUB_OUTPUT"
          echo "label=Built against sdk-ios-core develop @ $(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Write App Store Connect API key
        env:
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_CONTENT }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$API_KEY_CONTENT" | grep -q -- '-----BEGIN'; then
            printf '%s\n' "$API_KEY_CONTENT" > "$key_path"
          else
            printf '%s' "$API_KEY_CONTENT" | base64 --decode > "$key_path"
          fi
          echo "APP_STORE_CONNECT_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Run fastlane beta
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_CHANGELOG: ${{ inputs.changelog }}
          CORE_XCFRAMEWORK: ${{ steps.core.outputs.xcframework }}
          CORE_LABEL: ${{ steps.core.outputs.label }}
        run: |
          args=()
          [ -n "$INPUT_VERSION" ] && args+=("version:$INPUT_VERSION")
          [ -n "$INPUT_BUILD_NUMBER" ] && args+=("build_number:$INPUT_BUILD_NUMBER")
          [ -n "$INPUT_CHANGELOG" ] && args+=("changelog:$INPUT_CHANGELOG")
          [ -n "$CORE_XCFRAMEWORK" ] && args+=("core_xcframework:$CORE_XCFRAMEWORK" "core_label:$CORE_LABEL")
          bundle exec fastlane beta "${args[@]}"

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
